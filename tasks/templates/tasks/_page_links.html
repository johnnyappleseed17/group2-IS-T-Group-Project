{% if page_obj.has_other_pages %}
<nav aria-label="Task pages">
    {% if page_obj.has_previous %}
    <a href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page=1">First</a>
    <a href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>
    {% endif %}
    <span aria-current="page">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Next</a>
    <a href="?{% if filter_query %}{{ filter_query }}&amp;{% endif %}page={{ page_obj.paginator.num_pages }}">Last</a>
    {% endif %}
</nav>
{% endif %}
