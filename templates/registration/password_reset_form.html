{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
  <h1>Reset Password</h1>
  <p>Enter the email address for your account. We will send a reset link if that email is registered.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset email</button>
  </form>
  <p><a href="{% url 'login' %}">Back to login</a>
     ·
     <a href="{% url 'register' %}">Create an account</a></p>
{% endblock %}
