{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h1>My Profile</h1>
<p><strong>Username:</strong> {{ user.username }}</p>
<p>
  <strong>Role:</strong> {{ user_profile.get_role_display }}
  {% if user_profile.manager_requested %}<span class="badge text-bg-info">Manager request pending</span>{% endif %}
</p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
